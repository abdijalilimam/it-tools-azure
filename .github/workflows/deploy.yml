name: Build and Deploy to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ittoolsazure \
            --image it-tools:${{ github.sha }} \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name it-tools \
            --resource-group rg-it-tools-azure \
            --image ittoolsazure.azurecr.io/it-tools:${{ github.sha }}
