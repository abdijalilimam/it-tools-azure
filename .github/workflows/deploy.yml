name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ittoolsazure \
            --resource-group rg-it-tools-azure \
            --image it-tools:${{ github.sha }} \
            .

      - name: Deploy to Container Apps
        run: |
          URL="https://management.azure.com/subscriptions/febfd4c7-ff50-4eb7-965f-05306b56dfa3/resourceGroups/rg-it-tools-azure/providers/Microsoft.App/containerApps/it-tools?api-version=2023-05-01"

          az rest --method get --url "$URL" > current.json

          jq --arg image "ittoolsazure.azurecr.io/it-tools:${{ github.sha }}" \
            '.properties.template.containers[0].image = $image' current.json > updated.json

          az rest --method put --url "$URL" --body @updated.json